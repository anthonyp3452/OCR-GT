name: dpi_scanner_guatemala
description: Aplicación móvil Android para registro de trámites usando DPI de Guatemala con OCR offline
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # OCR Offline
  google_mlkit_text_recognition: ^0.11.0
  
  # Cámara
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  
  # Manejo de archivos
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # Generación de Excel
  excel: ^3.0.0
  
  # Permisos
  permission_handler: ^11.3.1
  
  # UI
  cupertino_icons: ^1.0.6
  
  # Fechas
  intl: ^0.19.0

  # Compartir archivo Excel
  share_plus: ^10.0.0
  cross_file: ^0.3.4+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
